name: warehouse
config-version: 2
profile: warehouse
model-paths: ["models"]

models:
  warehouse:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: incremental
      +incremental_strategy: merge
    marts:
      +schema: marts
      +materialized: incremental
      +incremental_strategy: merge
